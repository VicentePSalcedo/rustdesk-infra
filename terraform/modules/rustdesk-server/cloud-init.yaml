#cloud-config
# RustDesk Server Pro — hbbs + hbbr + Caddy reverse proxy (host networking).
# License is entered in the web console, not here.
# ${domain} is substituted by Terraform templatefile at apply time.

package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-v2

write_files:
  - path: /etc/rustdesk/Caddyfile
    permissions: '0644'
    content: |
      ${domain} {
          reverse_proxy 127.0.0.1:21114
      }

  - path: /etc/rustdesk/compose.yml
    permissions: '0644'
    content: |
      services:
        hbbs:
          container_name: hbbs
          image: docker.io/rustdesk/rustdesk-server-pro:latest
          command: hbbs
          volumes:
            - /var/lib/rustdesk:/root
          network_mode: "host"
          depends_on:
            - hbbr
          restart: unless-stopped

        hbbr:
          container_name: hbbr
          image: docker.io/rustdesk/rustdesk-server-pro:latest
          command: hbbr
          volumes:
            - /var/lib/rustdesk:/root
          network_mode: "host"
          restart: unless-stopped

        caddy:
          container_name: caddy
          image: caddy:2
          network_mode: "host"
          restart: unless-stopped
          volumes:
            - /etc/rustdesk/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
          depends_on:
            - hbbs

      volumes:
        caddy_data:
        caddy_config:

runcmd:
  - mkdir -p /var/lib/rustdesk
  - systemctl enable --now docker
  - docker compose -f /etc/rustdesk/compose.yml up -d
